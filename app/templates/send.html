{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded shadow">
    <h1 class="text-2xl font-bold mb-6">Send Campaign</h1>
    
    {% if dry_run %}
    <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 mb-6">
        <p class="font-bold">Dry Run Mode Enabled</p>
        <p>Emails will be logged but not sent.</p>
    </div>
    {% endif %}

    <form action="/send" method="post" class="space-y-4">
        <div>
            <label class="block text-gray-700 font-bold mb-2">Target Audience</label>
            <select name="audience" class="w-full border p-2 rounded">
                <option value="business">Business Only</option>
                <option value="individual">Individual Only</option>
                <option value="all">All Validated Leads</option>
            </select>
        </div>
        
        <div>
            <label class="block text-gray-700 font-bold mb-2">Subject</label>
            <input type="text" name="subject" value="Premium Singing Bowls for Your Business" class="w-full border p-2 rounded" required>
        </div>
        
        <div>
            <label class="block text-gray-700 font-bold mb-2">Message Body</label>
            <textarea name="body" rows="6" class="w-full border p-2 rounded" required>Hello,

We are a leading exporter of authentic Singing Bowls.
Please find our company presentation attached.

Best regards,
Sales Team</textarea>
        </div>
        
        <div class="pt-4">
            <button type="submit" class="bg-green-600 text-white px-6 py-3 rounded font-bold hover:bg-green-700 w-full">
                Dispatch Campaign
            </button>
        </div>
    </form>
</div>
{% endblock %}
