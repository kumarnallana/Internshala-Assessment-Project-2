{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded shadow">
    <h1 class="text-2xl font-bold mb-6">Classify Leads</h1>
    <p class="text-gray-600 mb-6">
        Run the AI Classification pipeline using Gemini to segment unclassified emails into Business and Individual.
    </p>
    
    <form action="/classify" method="post">
        <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded font-bold hover:bg-blue-700 w-full">
            Run AI Classification
        </button>
    </form>
</div>
{% endblock %}
