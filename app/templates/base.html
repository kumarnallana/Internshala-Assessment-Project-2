<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPORT Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #f1f5f9;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,0.05) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0.05) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,0.05) 0, transparent 50%);
            min-height: 100vh;
        }
        /* Premium Buttons */
        .bg-blue-600 {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%) !important;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.3) !important;
            transition: all 0.3s ease !important;
            border: none !important;
        }
        .bg-blue-600:hover {
            background: linear-gradient(135deg, #4338ca 0%, #2563eb 100%) !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4) !important;
        }
        /* Glassmorphism Cards */
        .bg-white {
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05) !important;
            border-radius: 1rem !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .bg-white:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.08) !important;
        }
        /* Navbar overrides */
        nav.bg-blue-600 {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(16px) !important;
            border-bottom: 1px solid rgba(226, 232, 240, 0.8) !important;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03) !important;
            color: #1e293b !important;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        nav a {
            color: #64748b;
            font-weight: 500;
            transition: all 0.2s ease;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
        }
        nav a:hover {
            color: #4f46e5;
            background: rgba(79, 70, 229, 0.05);
        }
        nav .font-bold {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            font-size: 1.5rem;
            padding: 0;
        }
        nav .font-bold:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #4f46e5 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }
        /* Premium Green Dispatch Button */
        .bg-green-600 {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%) !important;
            box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.3) !important;
            transition: all 0.3s ease !important;
            border: none !important;
        }
        .bg-green-600:hover {
            background: linear-gradient(135deg, #047857 0%, #059669 100%) !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4) !important;
        }
        /* Alert banners */
        .bg-yellow-100 {
            background: rgba(254, 243, 199, 0.7) !important;
            backdrop-filter: blur(8px) !important;
            border-left: 4px solid #f59e0b !important;
            border-radius: 0.75rem !important;
        }
        /* Tables */
        table th {
            color: #475569 !important;
            font-weight: 600 !important;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
        table td {
            color: #1e293b !important;
        }
        /* Inputs */
        input, textarea, select {
            border: 1px solid #e2e8f0 !important;
            border-radius: 0.5rem !important;
            transition: all 0.2s !important;
            background: rgba(255, 255, 255, 0.9) !important;
        }
        input:focus, textarea:focus, select:focus {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2) !important;
            border-color: #4f46e5 !important;
            outline: none !important;
        }
    </style>
</head>
<body class="text-gray-800 antialiased">
    <nav class="shadow-sm">
        <div class="container mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-4">
            <a href="/" class="font-bold tracking-tight">EXPORT AUTO</a>
            <div class="flex flex-wrap justify-center gap-1 sm:gap-2">
                <a href="/">Dashboard</a>
                <a href="/upload">Discover</a>
                <a href="/classify">Classify</a>
                <a href="/send">Campaigns</a>
                <a href="/report">Reports</a>
                <a href="/settings">Settings</a>
            </div>
        </div>
    </nav>
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
