{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100 space-y-6">
    <div>
        <h1 class="text-2xl font-extrabold text-gray-900">Lead Discovery Pipeline</h1>
        <p class="text-gray-500 text-sm mt-1">
            Configure search parameters to harvest high-intent buyer prospects across global search engines, social networks, and B2B directories.
        </p>
    </div>

    <form action="/upload" method="post" class="space-y-6">
        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Target Product / Export Keyword</label>
            <input type="text" name="keyword" value="Singing Bowls" placeholder="e.g. Handmade Singing Bowls, Cashmere Scarves" class="w-full p-3 border rounded-xl text-base" required>
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Connected Lead Sources</label>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <label class="flex items-center gap-2 p-3 bg-gray-50 rounded-xl border border-gray-100 text-sm font-medium text-gray-700 cursor-pointer">
                    <input type="checkbox" checked disabled class="text-blue-600 rounded"> Google Search
                </label>
                <label class="flex items-center gap-2 p-3 bg-gray-50 rounded-xl border border-gray-100 text-sm font-medium text-gray-700 cursor-pointer">
                    <input type="checkbox" checked disabled class="text-blue-600 rounded"> Facebook Leads
                </label>
                <label class="flex items-center gap-2 p-3 bg-gray-50 rounded-xl border border-gray-100 text-sm font-medium text-gray-700 cursor-pointer">
                    <input type="checkbox" checked disabled class="text-blue-600 rounded"> LinkedIn B2B
                </label>
                <label class="flex items-center gap-2 p-3 bg-gray-50 rounded-xl border border-gray-100 text-sm font-medium text-gray-700 cursor-pointer">
                    <input type="checkbox" checked disabled class="text-blue-600 rounded"> B2B Directories
                </label>
                <label class="flex items-center gap-2 p-3 bg-gray-50 rounded-xl border border-gray-100 text-sm font-medium text-gray-700 cursor-pointer">
                    <input type="checkbox" checked disabled class="text-blue-600 rounded"> Direct Websites
                </label>
                <label class="flex items-center gap-2 p-3 bg-gray-50 rounded-xl border border-gray-100 text-sm font-medium text-gray-700 cursor-pointer">
                    <input type="checkbox" checked disabled class="text-blue-600 rounded"> Regex Extractor
                </label>
            </div>
        </div>

        <div class="pt-4 border-t border-gray-100">
            <button type="submit" class="w-full bg-blue-600 text-white py-3.5 px-6 rounded-xl font-bold hover:bg-blue-700 transition shadow">
                Execute Multi-Platform Lead Harvesting
            </button>
        </div>
    </form>
</div>
{% endblock %}
